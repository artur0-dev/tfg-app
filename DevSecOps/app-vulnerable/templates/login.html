{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<form method="POST">
    <div class="mb-3">
        <label>Usuario</label>
        <input class="form-control" name="username">
    </div>
    <div class="mb-3">
        <label>Contraseña</label>
        <input type="password" class="form-control" name="password">
    </div>
    <button class="btn btn-primary">Entrar</button>
</form>
{% endblock %}

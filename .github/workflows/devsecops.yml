trivy:
  name: Trivy
  runs-on: ubuntu-latest
  needs: safety

  steps:

    - uses: actions/checkout@v4

    - name: Build Docker
      run: |

        docker build \
        -t vulnerable-app \
        ./app-vulnerable

    - uses: aquasecurity/trivy-action@master
      with:
        image-ref: vulnerable-app
        format: table
        output: trivy.txt
        exit-code: "0"

    - uses: actions/upload-artifact@v4
      with:
        name: trivy
        path: trivy.txt

name: Pipeline DevSecOps

on:
  workflow_dispatch:

jobs:

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: |
          pip install bandit

      - name: Ejecutar Bandit
        run: |
          mkdir resultados
          bandit -r app-vulnerable -f txt -o resultados/bandit.txt || true
          cat resultados/bandit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bandit
          path: resultados/bandit.txt

##################################################################################

  safety:

    name: SCA - Safety

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Safety
        run: |
          pip install safety

      - name: Ejecutar Safety
        run: |
          pip install -r app-vulnerable/requirements.txt
          safety check -r app-vulnerable/requirements.txt > safety.txt || true
          cat safety.txt

      - uses: actions/upload-artifact@v4
        with:
          name: safety
          path: safety.txt

##################################################################################

  gitleaks:

    name: Secretos - Gitleaks

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

##################################################################################

  trivy:

    name: Docker - Trivy

    runs-on: ubuntu-latest

    needs:

      - safety

    steps:

      - uses: actions/checkout@v4

      - name: Construir imagen
        run: |
          docker build \
            -t vulnerable-app \
            ./app-vulnerable

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-app
          format: table
          output: trivy.txt
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: trivy.txt

##################################################################################

  zap:

    name: DAST - OWASP ZAP

    runs-on: ubuntu-latest

    needs:

      - trivy

    steps:

      - uses: actions/checkout@v4

      - name: Construir Docker
        run: |
          docker build \
            -t vulnerable-app \
            ./app-vulnerable

      - name: Ejecutar contenedor
        run: |
          docker run -d \
            --name vulnerable \
            -p 5000:5000 \
            vulnerable-app

      - name: Esperar Flask
        run: |
          sleep 20

      - name: Comprobar aplicación
        run: |
          curl http://localhost:5000

      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-report

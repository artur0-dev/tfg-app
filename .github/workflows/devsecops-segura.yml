name: DevSecOps - Segura

on:
  workflow_dispatch:

jobs:

  bandit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit
        run: |
          mkdir -p resultados
          bandit -r app-segura -f txt -o resultados/bandit.txt || true
          cat resultados/bandit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bandit-segura
          path: resultados/bandit.txt

  safety:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install safety
          pip install -r app-segura/requirements.txt

      - run: |
          safety check -r app-segura/requirements.txt > safety.txt || true
          cat safety.txt

      - uses: actions/upload-artifact@v4
        with:
          name: safety-segura
          path: safety.txt

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker
        run: |
          docker build \
          -t secure-app \
          ./app-segura

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-app
          format: table
          output: trivy.txt
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-segura
          path: trivy.txt
   zap:
  name: DAST - OWASP ZAP
  runs-on: ubuntu-latest
  needs: trivy

  steps:
    - uses: actions/checkout@v4

    - name: Construir imagen
      run: docker build -t secure-app ./app-segura

    - name: Ejecutar aplicación
      run: |
        mkdir -p reports
        chmod -R 777 reports
        docker run -d --name secure -p 5000:5000 secure-app
        sleep 20

    - uses: zaproxy/action-baseline@v0.14.0
      with:
        target: "http://host.docker.internal:5000"
        cmd_options: "-a"
        allow_issue_writing: false
        artifact_name: zap-report-segura
            zap-report.html
            zap-report.xml
            zap-report.json


